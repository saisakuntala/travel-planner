<html>
    <head>
        <title>Travel Planner - Register</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
        <link rel="stylesheet" href="style.css">
        <style>
            .register-container {
                background-color: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 20px rgba(215, 5, 5, 0.15);
                width: 400px;
                max-width: 100%;
                margin: 10% auto 0 auto;
            }

            .register-container h2 {
                text-align: center;
                margin-bottom: 20px;
                font-size: 25px;
            }

            .register-form {
                display: flex;
                flex-direction: column;
            }

            .register-form label {
                margin-bottom: 5px;
                font-size: 16px;
            }

            .register-form input {
                padding: 10px;
                margin-bottom: 15px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 14px;
            }

            .register-form button {
                padding: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
                font-weight: 600;
            }

            .register-form button:hover {
                background-color: #0056b3;
            }

            .signin-link {
                padding: 15px 0 0 0;
                font-size: 14px;
                text-align: center;
            }

            .alert {
                padding: 10px;
                background-color: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
                border-radius: 5px;
                margin-bottom: 10px;
                font-size: 1.4rem;
                text-align: center;
            }

            .alert-success {
                background-color: #d4edda;
                color: #155724;
                border-color: #c3e6cb;
            }
        </style>
    </head>
    <body>
        <header>
            <div id="menu-bar" class="fas fa-bars"></div>
            <a href="index.html" class="logo"><span>TRAVEL </span>Planner</a>
            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="./mainpage/services.html">Services</a>
                <a href="./mainpage/reviews.html">Reviews</a>
                <a href="./mainpage/contact.html">Contact</a>
            </nav>
            <div class="icons">
                <a href="login.html"><i class="fas fa-user" id="login-btn"> Login</i></a>
            </div>
        </header>

        <div class="register-container">
            <h2>Travel Planner Registration</h2>
            <div id="alert-box"></div>
            <form class="register-form">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Min. 8 characters" required>
                
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm_password" required>
                
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required>
                
                <button type="submit">Register</button>
                <p class="signin-link">Already have an account? <a href="login.html">Sign in</a></p>
            </form>
        </div>
        
        <footer>
            <p>&copy; 2025 Travel Planner. All rights reserved.</p>
        </footer>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const form = document.querySelector(".register-form");
                const alertBox = document.getElementById("alert-box");

                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    alertBox.innerHTML = ""; // Clear existing alerts

                    const fullname = document.getElementById("fullname").value.trim();
                    const email = document.getElementById("email").value.trim().toLowerCase();
                    const password = document.getElementById("password").value;
                    const confirmPassword = document.getElementById("confirm-password").value;
                    const location = document.getElementById("location").value.trim();

                    const errors = [];

                    // validation checks
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        errors.push("Email is not valid");
                    }
                    if (password.length < 8) {
                        errors.push("Password must be at least 8 characters");
                    }
                    if (password !== confirmPassword) {
                        errors.push("Passwords do not match");
                    }

                    // Check duplicate registration
                    let users = localStorage.getItem("users");
                    users = users ? JSON.parse(users) : [];
                    if (users.some(u => u.email.toLowerCase() === email)) {
                        errors.push("Email already exists");
                    }

                    if (errors.length > 0) {
                        errors.forEach(err => {
                            const div = document.createElement("div");
                            div.className = "alert";
                            div.innerText = err;
                            alertBox.appendChild(div);
                        });
                    } else {
                        // Save user
                        const newUser = { fullname, email, password, location };
                        users.push(newUser);
                        localStorage.setItem("users", JSON.stringify(users));

                        alertBox.innerHTML = `<div class="alert alert-success">You registered successfully! Redirecting to login...</div>`;
                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, 1200);
                    }
                });
            });
        </script>
    </body>
</html>
